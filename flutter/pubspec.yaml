name: pdf_studio
description: "PDF Studio — a native Flutter PDF reader and page organizer inspired by PdfCraft."
publish_to: 'none'
version: 1.5.1+7

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

  # PDF engine (PDFium): viewing, search, outline, page assembly, image import.
  pdfrx: ^3.1.0

  file_picker: ^13.4.1
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  animated_reorderable_list: ^1.3.0
  jpeg_encode: ^1.0.1
  archive: ^4.0.7
  url_launcher: ^6.3.3
  google_mlkit_document_scanner: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tess/
