name: Build Flutter APK (PDF Studio)

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/build-flutter.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-flutter
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - name: Generate missing platform files
        # Only android/ files that aren't committed get created (gradle, styles, ...).
        # Our AndroidManifest.xml, MainActivity.kt and icons are kept as they are.
        run: |
          flutter --version
          flutter create --platforms=android --org com.faria2177 --project-name pdf_studio .
          rm -rf test
          git status --short

      - name: Stable signing key
        # Same key on every run, so new APKs install as updates over old ones.
        run: |
          mkdir -p ~/.android
          base64 -d android/debug.keystore.b64 > ~/.android/debug.keystore

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-number=${{ github.run_number }}
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          OUT="PdfStudio-${VER}-b${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          ls -lh "$OUT"
          echo "APK=flutter/$OUT" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-apk
          path: ${{ env.APK }}

      - name: Publish GitHub Release
        working-directory: .
        run: |
          TAG="studio-v${VER}-b${{ github.run_number }}"
          gh release create "$TAG" "$APK" \
            --title "PDF Studio (Flutter) $TAG" \
            --notes "Native Flutter build (pdfrx/PDFium). Commit ${{ github.sha }}."
