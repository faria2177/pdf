name: Auto crop device check (PDF Studio)

# Runs the real auto-crop (Dart detectors + native doclens warp) on an
# Android emulator against synthetic sleeve-card / page photos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter/lib/ds/services/**"
      - "flutter/third_party/doclens/android/**"
      - "flutter/third_party/doclens/lib/**"
      - "flutter/integration_test/**"
      - "flutter/tool/make_scan_fixtures.py"
      - ".github/workflows/autocrop-check.yml"

concurrency:
  group: autocrop-check
  cancel-in-progress: true

jobs:
  autocrop:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true
      - name: Generate synthetic photos
        run: |
          pip install --quiet opencv-python-headless numpy pillow
          python3 tool/make_scan_fixtures.py
      - name: Prepare Android project
        run: |
          flutter create --platforms=android --org com.faria2177 --project-name pdf_studio .
          rm -rf test
          mkdir -p ~/.android && base64 -d android/debug.keystore.b64 > ~/.android/debug.keystore
          flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run auto crop on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          working-directory: flutter
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: flutter test integration_test/auto_crop_device_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee autocrop.log; grep -E "AUTOCROP|AutoCrop|DocumentEdges|Exception|Error" autocrop.log | head -120; adb pull /sdcard/Android/data/com.faria2177.pdf_studio/files/autocrop shots || true; grep -q "All tests passed" autocrop.log
      - name: Upload crops
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocrop-shots
          path: |
            flutter/shots
            flutter/autocrop.log
          if-no-files-found: ignore
